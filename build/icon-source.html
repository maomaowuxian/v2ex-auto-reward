<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        display: grid;
        place-items: center;
      }

      .card {
        width: 760px;
        height: 760px;
        border-radius: 180px;
        background:
          radial-gradient(circle at 24% 18%, rgba(255, 231, 200, 0.95), transparent 24%),
          radial-gradient(circle at 78% 82%, rgba(116, 58, 31, 0.22), transparent 28%),
          linear-gradient(160deg, #d86d3e 0%, #c8582b 50%, #8b3619 100%);
        box-shadow:
          inset 0 0 0 10px rgba(255, 245, 230, 0.18),
          0 50px 90px rgba(71, 24, 7, 0.35);
        position: relative;
      }

      .ring {
        position: absolute;
        inset: 78px;
        border-radius: 148px;
        background: linear-gradient(180deg, #fff8ef 0%, #f6e2c8 100%);
        box-shadow: inset 0 -18px 30px rgba(169, 88, 48, 0.12);
      }

      .coin {
        position: absolute;
        right: 96px;
        top: 92px;
        width: 154px;
        height: 154px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff4c7 0%, #f2c757 50%, #c8891f 100%);
        box-shadow:
          inset 0 10px 14px rgba(255, 255, 255, 0.46),
          0 18px 28px rgba(114, 67, 14, 0.22);
      }

      .coin::before {
        content: "✓";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font: 900 78px/1 "Avenir Next", sans-serif;
        color: rgba(111, 63, 18, 0.88);
      }

      .v {
        position: absolute;
        left: 162px;
        top: 176px;
        font: 900 300px/1 "Avenir Next", "PingFang SC", sans-serif;
        letter-spacing: -0.08em;
        color: #9f3d1d;
        text-shadow: 0 18px 28px rgba(94, 40, 16, 0.12);
      }

      .caption {
        position: absolute;
        left: 166px;
        bottom: 148px;
        padding: 16px 24px;
        border-radius: 999px;
        background: #f9ead8;
        color: #b6552e;
        font: 800 48px/1 "Avenir Next", "PingFang SC", sans-serif;
        box-shadow: 0 16px 30px rgba(119, 59, 28, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="ring"></div>
      <div class="coin"></div>
      <div class="v">V</div>
      <div class="caption">AUTO</div>
    </div>
  </body>
</html>
